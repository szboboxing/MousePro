name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish assets for, for example v1.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag }}
  MOUSEPRO_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag }}
  MOUSEPRO_GIT_DIRTY: "false"
  WINDOWS_ARCHIVE_NAME: ${{ format('MousePro-{0}-Windows.zip', startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag) }}

jobs:
  # v1.3.5 uses the independently validated Windows archive; never rebuild or replace it.
  build-windows:
    if: github.ref != 'refs/tags/v1.3.5' && github.event.inputs.release_tag != 'v1.3.5'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify immutable release source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test -z "$(git status --porcelain)"
          echo "MOUSEPRO_GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $gitDirectory = Split-Path (Get-Command git).Source
          $env:PATH = "$(Split-Path $python);$gitDirectory;$env:WINDIR\System32;$env:WINDIR"
          & $python -m PyInstaller MousePro.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          if (Test-Path dist/MousePro/_internal/icuuc.dll) { throw "Unexpected non-system ICU library" }

      - name: Smoke test Windows startup
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "mousepro-smoke"
          $process = Start-Process -FilePath (Resolve-Path dist/MousePro/MousePro.exe) -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($process.HasExited) { throw "Packaged application exited during startup" }
            $log = Get-Content (Join-Path $env:APPDATA "MousePro/logs/MousePro.log") -Raw
            if ($log -notmatch "QML load:" -or $log -match "Traceback") { throw "Packaged QML startup failed" }
            Write-Output $log
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }

      - name: Stage release documentation
        shell: pwsh
        run: |
          Copy-Item LICENSE, README.md, README_CN.md, CHANGELOG.md, RELEASE_NOTES.md dist/MousePro/
          New-Item -ItemType Directory -Force dist/MousePro/images | Out-Null
          Copy-Item images/Screenshot*.png, images/logo.png dist/MousePro/images/

      - name: Create archive
        run: Compress-Archive -Path dist\\MousePro -DestinationPath "${{ env.WINDOWS_ARCHIVE_NAME }}"

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath "${{ env.WINDOWS_ARCHIVE_NAME }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "${{ env.WINDOWS_ARCHIVE_NAME }}.sha256" -Value "$hash  ${{ env.WINDOWS_ARCHIVE_NAME }}" -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: MousePro-Windows
          path: |
            ${{ env.WINDOWS_ARCHIVE_NAME }}
            ${{ env.WINDOWS_ARCHIVE_NAME }}.sha256

  build-macos:
    if: github.ref != 'refs/tags/v1.4.3' && github.event.inputs.release_tag != 'v1.4.3' && github.ref != 'refs/tags/v1.4.2' && github.event.inputs.release_tag != 'v1.4.2' && github.ref != 'refs/tags/v1.4.1' && github.event.inputs.release_tag != 'v1.4.1' && github.ref != 'refs/tags/v1.4.0' && github.event.inputs.release_tag != 'v1.4.0' && github.ref != 'refs/tags/v1.3.5' && github.event.inputs.release_tag != 'v1.3.5'
    name: build-macos (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            python_architecture: arm64
            pyinstaller_target_arch: arm64
            artifact_name: MousePro-macOS
            archive_name: MousePro-macOS.zip
          - name: Intel
            runner: macos-15-intel
            python_architecture: x64
            pyinstaller_target_arch: x86_64
            artifact_name: MousePro-macOS-intel
            archive_name: MousePro-macOS-intel.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify immutable release source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test -z "$(git status --porcelain)"
          echo "MOUSEPRO_GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_architecture }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build macOS app
        env:
          PYINSTALLER_TARGET_ARCH: ${{ matrix.pyinstaller_target_arch }}
        run: |
          chmod +x build_macos_app.sh
          ./build_macos_app.sh

      - name: Create archive
        run: cd dist && zip -r -y "../${{ matrix.archive_name }}" MousePro.app

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}

  build-linux:
    if: github.ref != 'refs/tags/v1.4.3' && github.event.inputs.release_tag != 'v1.4.3' && github.ref != 'refs/tags/v1.4.2' && github.event.inputs.release_tag != 'v1.4.2' && github.ref != 'refs/tags/v1.4.1' && github.event.inputs.release_tag != 'v1.4.1' && github.ref != 'refs/tags/v1.4.0' && github.event.inputs.release_tag != 'v1.4.0' && github.ref != 'refs/tags/v1.3.5' && github.event.inputs.release_tag != 'v1.3.5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify immutable release source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test -z "$(git status --porcelain)"
          echo "MOUSEPRO_GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhidapi-dev \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-util1 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xkb1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller MousePro-linux.spec --noconfirm

      - name: Audit Linux bundle dependencies
        run: |
          python - <<'PY'
          import os
          import pathlib
          import stat
          import subprocess

          bundle_root = os.path.join("dist", "MousePro")
          if not os.path.isdir(bundle_root):
              raise SystemExit(f"Missing bundle directory: {bundle_root}")

          bundle_root_path = pathlib.Path(bundle_root).resolve()
          internal_root = bundle_root_path / "_internal"
          pyside_root = internal_root / "PySide6"
          hidapi_root = internal_root / "hidapi.libs"

          def is_elf(path: str) -> bool:
              try:
                  mode = os.stat(path).st_mode
              except OSError:
                  return False
              if not stat.S_ISREG(mode):
                  return False
              with open(path, "rb") as fh:
                  return fh.read(4) == b"\x7fELF"

          library_dirs = []
          for root, _, files in os.walk(bundle_root):
              if any(".so" in name for name in files):
                  library_dirs.append(root)

          ld_library_path = ":".join(dict.fromkeys(library_dirs))
          env = os.environ.copy()
          if ld_library_path:
              env["LD_LIBRARY_PATH"] = ld_library_path

          def should_audit(path: pathlib.Path) -> bool:
              if path == bundle_root_path / "MousePro":
                  return True
              try:
                  relative = path.relative_to(pyside_root)
                  return "plugins" not in relative.parts and "qml" not in relative.parts
              except ValueError:
                  pass
              try:
                  path.relative_to(hidapi_root)
                  return True
              except ValueError:
                  return False

          missing = []
          for root, _, files in os.walk(bundle_root):
              for name in files:
                  path = pathlib.Path(root, name).resolve()
                  if not is_elf(str(path)) or not should_audit(path):
                      continue
                  result = subprocess.run(
                      ["ldd", str(path)],
                      check=False,
                      capture_output=True,
                      text=True,
                      env=env,
                  )
                  output = result.stdout + result.stderr
                  unresolved = [
                      line.strip()
                      for line in output.splitlines()
                      if "not found" in line
                  ]
                  if unresolved:
                      missing.append((path, unresolved))

          if missing:
              for path, unresolved in missing:
                  print(path)
                  for line in unresolved:
                      print(f"  {line}")
              raise SystemExit("Linux bundle contains unresolved shared-library dependencies")
          PY

      - name: Smoke test Linux bundle startup
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout --kill-after=5s 15s ./dist/MousePro/MousePro
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then
            exit "$status"
          fi

      - name: Add Linux permission helper
        run: |
          cp packaging/linux/69-mousepro-logitech.rules dist/MousePro/
          cp packaging/linux/install-linux-permissions.sh dist/MousePro/
          chmod +x dist/MousePro/install-linux-permissions.sh

      - name: Create archive
        run: cd dist && zip -r -y ../MousePro-Linux.zip MousePro

      - uses: actions/upload-artifact@v7
        with:
          name: MousePro-Linux
          path: MousePro-Linux.zip

  release:
    if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && github.ref != 'refs/tags/v1.3.5' && github.event.inputs.release_tag != 'v1.3.5'
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify immutable release source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test -z "$(git status --porcelain)"
          echo "MOUSEPRO_GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          pattern: MousePro-Windows*
          path: MousePro-Windows
          merge-multiple: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate update metadata
        run: |
          mkdir -p update-assets
          cp "MousePro-Windows/${{ env.WINDOWS_ARCHIVE_NAME }}" update-assets/
          python tools/generate_update_manifest.py \
            --repo "${{ github.repository }}" \
            --tag "${{ env.RELEASE_TAG }}" \
            --commit "${{ env.MOUSEPRO_GIT_COMMIT }}" \
            --asset-dir update-assets \
            --output "mousepro-${{ env.RELEASE_TAG }}-update.json"

      - uses: actions/upload-artifact@v7
        with:
          name: MousePro-Update-Metadata
          path: mousepro-${{ env.RELEASE_TAG }}-update.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release already exists; published assets are immutable."
            exit 1
          fi
          gh release create "${{ env.RELEASE_TAG }}" \
            --repo "${{ github.repository }}" \
            --title "MousePro ${{ env.RELEASE_TAG }}" \
            --notes-file RELEASE_NOTES.md \
            "MousePro-Windows/${{ env.WINDOWS_ARCHIVE_NAME }}" \
            "MousePro-Windows/${{ env.WINDOWS_ARCHIVE_NAME }}.sha256" \
            mousepro-${{ env.RELEASE_TAG }}-update.json
